<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Pauta Settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --panel: #ffffff;
        --text: #1c1c1e;
        --muted: #6e6e73;
        --border: #dcdce0;
        --accent: #ff3b6e;
        --warn: #c4314b;
        font: 13px/1.4 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --panel: #2c2c2e;
          --text: #f2f2f7;
          --muted: #98989f;
          --border: #3a3a3c;
          --warn: #ff6b81;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      main { padding: 20px; display: grid; gap: 20px; }
      h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
      .row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 14px; }
      .row + .row { border-top: 1px solid var(--border); }
      .row > .label { flex: 1; }
      .hint { color: var(--muted); font-size: 12px; }
      .warn { color: var(--warn); font-size: 12px; }
      input[type='color'] { width: 40px; height: 26px; padding: 0; border: 1px solid var(--border); border-radius: 4px; background: none; cursor: pointer; }
      input[type='range'] { width: 140px; accent-color: var(--accent); }
      input[type='number'] { width: 56px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); font: inherit; }
      input[type='checkbox'] { width: 16px; height: 16px; accent-color: var(--accent); }
      output { width: 36px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
      button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .key { min-width: 150px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; text-align: center; }
      .key.recording { border-color: var(--accent); color: var(--accent); }
      .link { border: none; background: none; color: var(--muted); padding: 4px; text-decoration: underline; }
      .shortcut-meta { display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
